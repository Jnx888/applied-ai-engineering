name: CodeQL security analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly source analysis, including when source code has not changed (UTC).
    - cron: '43 16 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; existing repository pin
        with:
          persist-credentials: false

      - name: Initialize static analysis
        # Official v4 and v4.39.1 peeled tags resolved to this commit on 2026-10-23 UTC.
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths:
              - object-evidence
              - staffing-agent
              - agent-capability-gateway

      - name: Analyze and publish code-scanning results
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          upload-database: false

# No pull_request_target, repository-write/deployment permission, custom secret,
# install/build command, auto-fix, auto-merge or deployment step is used here.
